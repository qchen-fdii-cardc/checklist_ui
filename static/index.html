<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checklist Manager</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --muted: #64748b;
            --border: #dfe7f1;
            --success: #16a34a;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #eef4ff, var(--bg));
            color: #0f172a;
        }

        .container {
            max-width: 1100px;
            margin: 32px auto;
            padding: 0 20px 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .title {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .header-search {
            margin-left: auto;
            width: min(100%, 480px);
        }

        .subtitle {
            color: var(--muted);
            margin-top: 4px;
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 20px;
        }

        .panel h3 {
            margin: 0 0 16px;
            font-size: 1.1rem;
        }

        .create-panel {
            margin-bottom: 24px;
            transition: all 0.2s ease;
        }

        .create-panel.collapsed {
            max-height: 72px;
            overflow: hidden;
        }

        .create-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            cursor: pointer;
            user-select: none;
        }

        .create-panel-header h3 {
            margin: 0;
        }

        .panel-toggle {
            width: auto;
            min-width: 110px;
            border: 1px solid var(--border);
            background: #f8fafc;
            color: #1e293b;
            cursor: pointer;
            font-weight: 700;
            border-radius: 999px;
            padding: 8px 12px;
        }

        .create-form {
            margin-top: 18px;
        }

        .create-panel.collapsed .create-form {
            display: none;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #334155;
        }

        input,
        textarea,
        button {
            width: 100%;
            border-radius: 12px;
            font: inherit;
        }

        input,
        textarea {
            background: #fff;
            border: 1px solid var(--border);
            padding: 12px 14px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            margin-bottom: 14px;
        }

        .stack {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .primary-btn,
        .secondary-btn {
            border: none;
            cursor: pointer;
            font-weight: 700;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .primary-btn:hover,
        .secondary-btn:hover {
            transform: translateY(-1px);
        }

        .primary-btn {
            background: var(--primary);
            color: #fff;
            padding: 12px 16px;
        }

        .primary-btn:hover {
            background: var(--primary-dark);
        }

        .secondary-btn {
            background: #eef2ff;
            color: var(--primary-dark);
            padding: 10px 14px;
        }

        .toolbar {
            margin-top: 16px;
            display: flex;
            gap: 12px;
        }

        .create-mode-switch {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        .mode-btn {
            flex: 1;
            border: 1px solid var(--border);
            background: #f8fafc;
            color: #334155;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 700;
        }

        .mode-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .create-mode-section.hidden {
            display: none;
        }

        .result-actions {
            display: flex;
            flex-direction: row;
            gap: 12px;
            margin: 0 auto 18px;
            max-width: 760px;
            width: min(100%, 760px);
        }

        .result-actions button {
            flex: 1 1 0;
            width: 100%;
        }

        .search-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            font-size: 1rem;
            padding: 15px 16px;
            min-height: 58px;
        }

        .search-actions {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .search-actions button {
            flex: 1 1 0;
            min-height: 58px;
            padding: 15px 24px;
            font-size: 1.05rem;
        }

        .secondary-btn-small {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .status {
            margin-top: 16px;
            min-height: 20px;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .status.success {
            color: var(--success);
        }

        .status.error {
            color: var(--danger);
        }

        .results {
            margin-top: 18px;
            display: grid;
            gap: 18px;
        }

        .checklist-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 18px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }

        .checklist-card:hover {
            transform: translateY(-1px);
        }

        .checklist-card.selected {
            grid-column: 1 / -1;
            max-width: 760px;
            width: min(100%, 760px);
            margin: 0 auto;
            border-color: rgba(37, 99, 235, 0.6);
            box-shadow: 0 16px 40px rgba(37, 99, 235, 0.16);
        }

        .checklist-card h4 {
            margin: 0 0 6px;
            font-size: 1.2rem;
        }

        .meta {
            color: var(--muted);
            font-size: 0.88rem;
            margin-bottom: 10px;
        }

        .items {
            list-style: none;
            padding: 0;
            margin: 10px 0 0;
            display: grid;
            gap: 8px;
        }

        .items li {
            background: #f8fafc;
            border: 1px solid #edf2f7;
            padding: 10px 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .step-item {
            cursor: pointer;
        }

        .step-toggle {
            width: 18px;
            height: 18px;
            min-width: 18px;
            margin: 0;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .step-toggle:disabled {
            cursor: not-allowed;
            opacity: 0.5;
            filter: grayscale(1);
        }

        .step-label {
            flex: 1;
            word-break: break-word;
        }

        .step-disabled {
            opacity: 0.55;
            filter: grayscale(1);
        }

        .search-panel {
            margin-top: 22px;
        }

        @media (max-width: 820px) {
            .container {
                max-width: 100%;
                margin: 20px auto;
                padding: 0 12px 28px;
            }

            .header {
                display: block;
                margin-bottom: 16px;
            }

            .title {
                font-size: 1.7rem;
            }

            .subtitle {
                font-size: 0.9rem;
                line-height: 1.4;
            }

            .header-search {
                width: 100%;
                margin: 12px 0 0;
            }

            .search-panel {
                margin-top: 0;
            }

            .panel {
                padding: 14px;
            }

            .panel h3 {
                margin-bottom: 12px;
            }

            .result-actions {
                flex-direction: column;
                max-width: 100%;
                width: 100%;
                margin: 12px 0 0;
            }

            .result-actions button {
                min-height: 46px;
            }

            .row {
                grid-template-columns: 1fr;
            }

            .checklist-card,
            .checklist-card.selected {
                width: 100%;
                max-width: 100%;
                margin: 0;
                padding: 14px;
            }

            .checklist-card h4 {
                font-size: 1.08rem;
            }

            .meta {
                font-size: 0.8rem;
            }

            .items li {
                padding: 8px 10px;
            }

            .create-mode-switch,
            .toolbar {
                flex-direction: column;
            }

            .mode-btn,
            .primary-btn,
            .secondary-btn,
            .panel-toggle {
                min-height: 44px;
            }

            .search-box input {
                min-height: 48px;
                padding: 12px 14px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div>
                <div class="title">Checklist Manager</div>
                <div class="subtitle">Create, search, and review checklists from any configured backend</div>
            </div>
            <div class="header-search">
                <div class="panel search-panel" style="margin: 0; padding: 12px 14px;">
                    <div class="search-box">
                        <input id="searchInput" placeholder="Search by title, description, or step" />
                    </div>
                </div>
            </div>
        </div>

        <section class="panel">
            <h3 style="margin: 0;">Results</h3>
            <div id="results" class="results"></div>
        </section>

        <section class="panel create-panel collapsed" id="createPanel">
            <div class="create-panel-header" id="toggleCreatePanel" aria-expanded="false" aria-controls="createForm">
                <h3>Create checklist</h3>
                <button type="button" class="panel-toggle" id="toggleCreateBtn">Expand</button>
            </div>
            <div class="create-form" id="createForm">
                <div class="create-mode-switch">
                    <button type="button" class="mode-btn active" data-mode="text">Text-based</button>
                    <button type="button" class="mode-btn" data-mode="form">Forms</button>
                </div>

                <div class="stack">
                    <div id="textCreateSection" class="create-mode-section">
                        <div class="row">
                            <div>
                                <label for="checklistText">Checklist text</label>
                                <textarea id="checklistText"
                                    placeholder="# Project kickoff: Preparation tasks&#10;Draft brief&#10;Confirm timeline&#10;Book meeting room"></textarea>
                            </div>
                        </div>

                        <div class="toolbar">
                            <button class="primary-btn" id="createTextBtn">Create from text</button>
                        </div>
                    </div>

                    <div id="formCreateSection" class="create-mode-section hidden">
                        <div class="row">
                            <div>
                                <label for="title">Title</label>
                                <input id="title" placeholder="Project kickoff" />
                            </div>
                        </div>

                        <div class="row">
                            <div>
                                <label for="description">Description</label>
                                <input id="description" placeholder="Preparation tasks" />
                            </div>
                        </div>

                        <div>
                            <label for="items">Checklist items</label>
                            <textarea id="items"
                                placeholder="One item per line&#10;Draft brief&#10;Confirm timeline&#10;Book meeting room"></textarea>
                        </div>

                        <div class="toolbar">
                            <button class="primary-btn" id="createFormBtn">Create from form</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        // UI behavior summary:
        // - a single input drives live search and special commands like /rand
        // - results are capped to 10 items on both the client and the server
        // - the first visible checklist is auto-selected to keep the expanded-card UX stable
        const API_BASE = "__API_BASE__";
        const MAX_VISIBLE_RESULTS = 10;
        const RESULTS_LIMIT_PARAM = `limit=${MAX_VISIBLE_RESULTS}`;
        const statusEl = document.getElementById('status');
        const resultsEl = document.getElementById('results');
        const createPanelEl = document.getElementById('createPanel');
        const toggleCreateBtn = document.getElementById('toggleCreateBtn');
        const toggleCreatePanel = document.getElementById('toggleCreatePanel');
        const textCreateSection = document.getElementById('textCreateSection');
        const formCreateSection = document.getElementById('formCreateSection');
        let selectedChecklistId = null;
        let lastLoadedChecklists = [];
        const checklistProgress = {};

        function parseChecklistText(text) {
            const trimmed = (text || '').trim();
            if (!trimmed) {
                return { title: '', description: '', items: [] };
            }

            const lines = trimmed.split(/\r?\n/);
            const header = lines[0].trim();
            let title = '';
            let description = '';

            if (header.startsWith('#')) {
                const rawHeader = header.replace(/^#\s*/, '').trim();
                if (rawHeader.includes(':')) {
                    const separatorIndex = rawHeader.indexOf(':');
                    title = rawHeader.slice(0, separatorIndex).trim();
                    description = rawHeader.slice(separatorIndex + 1).trim();
                } else {
                    title = rawHeader.trim();
                }
            } else {
                title = header.trim();
            }

            const items = lines.slice(1)
                .map(line => line.trim())
                .filter(Boolean);

            return { title, description, items };
        }

        function buildChecklistText({ title, description, items }) {
            const safeTitle = (title || '').trim();
            const safeDescription = (description || '').trim();
            const safeItems = (items || []).map(item => String(item).trim()).filter(Boolean);

            if (!safeTitle && safeItems.length === 0) {
                return '';
            }

            return `# ${safeTitle || 'Checklist'}${safeDescription ? `: ${safeDescription}` : ''}\n${safeItems.join('\n')}`;
        }

        function syncFormFromText() {
            const draft = parseChecklistText(document.getElementById('checklistText').value);
            document.getElementById('title').value = draft.title;
            document.getElementById('description').value = draft.description;
            document.getElementById('items').value = draft.items.join('\n');
        }

        function syncTextFromForm() {
            const draft = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                items: document.getElementById('items').value
                    .split(/\n/)
                    .map(x => x.trim())
                    .filter(Boolean)
            };
            document.getElementById('checklistText').value = buildChecklistText(draft);
        }

        function setCreateMode(mode) {
            const isText = mode === 'text';
            textCreateSection.classList.toggle('hidden', !isText);
            formCreateSection.classList.toggle('hidden', isText);
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            if (!isText) {
                syncFormFromText();
            } else {
                syncTextFromForm();
            }
        }

        function expandCreatePanel(mode = 'text') {
            createPanelEl.classList.remove('collapsed');
            toggleCreateBtn.textContent = 'Collapse';
            toggleCreatePanel.setAttribute('aria-expanded', 'true');
            setCreateMode(mode);
            requestAnimationFrame(() => {
                createPanelEl.scrollIntoView({ behavior: 'smooth', block: 'end' });
            });
        }

        function getSelectedChecklist() {
            if (!selectedChecklistId) {
                return null;
            }
            return lastLoadedChecklists.find(item => String(item.id) === String(selectedChecklistId)) || null;
        }

        function populateCreatePanelFromTemplate(mode) {
            const checklist = getSelectedChecklist();
            if (!checklist) {
                setStatus('Select a checklist first to use it as a template', 'error');
                return false;
            }

            const title = checklist.title || 'Untitled checklist';
            const description = checklist.description || '';
            const items = (checklist.items || []).map(item => item.step || '').filter(Boolean);
            const text = buildChecklistText({ title, description, items });
            document.getElementById('checklistText').value = text;
            document.getElementById('title').value = title;
            document.getElementById('description').value = description;
            document.getElementById('items').value = items.join('\n');

            expandCreatePanel(mode);
            return true;
        }

        function setStatus(message, kind = '') {
            if (!statusEl) {
                return;
            }
            statusEl.textContent = message;
            statusEl.className = 'status';
            if (kind) statusEl.classList.add(kind);
        }

        function escapeHtml(value = '') {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function getProgress(checklistId, itemCount) {
            const key = String(checklistId ?? '');
            if (!checklistProgress[key]) {
                checklistProgress[key] = Array(itemCount).fill(false);
            }
            if (checklistProgress[key].length < itemCount) {
                checklistProgress[key] = checklistProgress[key].concat(Array(itemCount - checklistProgress[key].length).fill(false));
            }
            return checklistProgress[key].slice(0, itemCount);
        }

        function updateChecklistProgress(checklistId, stepIndex, checked, itemCount) {
            const key = String(checklistId ?? '');
            const states = getProgress(key, itemCount);
            if (checked) {
                const previousChecked = states.slice(0, stepIndex).every(Boolean);
                if (!previousChecked) {
                    return false;
                }
                states[stepIndex] = true;
            } else {
                for (let i = stepIndex; i < states.length; i += 1) {
                    states[i] = false;
                }
            }
            checklistProgress[key] = states;
            return true;
        }

        function renderChecklist(checklist, isSelected = false) {
            const title = escapeHtml(checklist.title || 'Untitled checklist');
            const description = escapeHtml(checklist.description || 'No description');
            const createdAt = escapeHtml(checklist.created_at || 'unknown date');
            const meta = `
                <h4>${title}</h4>
                <div class="meta">${description} • ${createdAt}</div>
            `;

            if (!isSelected) {
                return `
                  <article class="checklist-card" data-checklist-id="${checklist.id ?? ''}">
                    ${meta}
                  </article>
                `;
            }

            const progress = getProgress(checklist.id, (checklist.items || []).length);
            const items = (checklist.items || [])
                .map((item, index) => {
                    const checked = Boolean(progress[index]);
                    const priorStepsComplete = progress.slice(0, index).every(Boolean);
                    const isStepDisabled = !checked && !priorStepsComplete && index > 0;
                    return `
                        <li class="step-item ${isStepDisabled ? 'step-disabled' : ''}">
                            <input class="step-toggle" type="checkbox" data-checklist-id="${checklist.id ?? ''}" data-step-index="${index}" ${checked ? 'checked' : ''} ${isStepDisabled ? 'disabled' : ''} />
                            <span class="step-label">${escapeHtml(item.step || 'Untitled item')}</span>
                        </li>
                    `;
                })
                .join('');

            return `
          <article class="checklist-card selected" data-checklist-id="${checklist.id ?? ''}">
            ${meta}
            <ul class="items">${items || '<li><span class="step-label">No items</span></li>'}</ul>
          </article>
        `;
        }

        function renderCreateFromActions() {
            return `
                <div class="result-actions">
                    <button class="primary-btn" id="openTextCreateBtn">Create from (text-based)</button>
                    <button class="primary-btn" id="openFormCreateBtn">Create from (forms)</button>
                </div>
            `;
        }

        function bindCreateFromButtons() {
            const textBtn = document.getElementById('openTextCreateBtn');
            const formBtn = document.getElementById('openFormCreateBtn');

            if (textBtn) {
                textBtn.onclick = () => populateCreatePanelFromTemplate('text');
            }

            if (formBtn) {
                formBtn.onclick = () => populateCreatePanelFromTemplate('form');
            }
        }

        function renderChecklistList(data) {
            const items = Array.isArray(data) ? data.slice(0, MAX_VISIBLE_RESULTS) : [];
            lastLoadedChecklists = items;

            if (!selectedChecklistId && items.length > 0) {
                selectedChecklistId = String(items[0].id);
            }

            const selected = items.find(item => String(item.id) === String(selectedChecklistId));
            const remaining = items.filter(item => String(item.id) !== String(selectedChecklistId));
            const html = [];

            if (selected) {
                html.push(renderChecklist(selected, true));
                html.push(renderCreateFromActions());
            }

            html.push(...remaining.map(item => renderChecklist(item, false)));

            resultsEl.innerHTML = html.length ? html.join('') : '<p>No results.</p>';
            bindCreateFromButtons();

            resultsEl.querySelectorAll('.step-item').forEach(item => {
                item.addEventListener('click', (event) => {
                    const input = item.querySelector('.step-toggle');
                    if (!input || input.disabled) {
                        return;
                    }

                    event.preventDefault();
                    event.stopPropagation();
                    input.checked = !input.checked;
                    input.dispatchEvent(new Event('change', { bubbles: true }));
                });
            });

            resultsEl.querySelectorAll('.step-toggle').forEach(input => {
                input.addEventListener('click', (event) => {
                    event.stopPropagation();
                });

                input.addEventListener('change', (event) => {
                    const checklistId = event.target.dataset.checklistId;
                    const stepIndex = Number(event.target.dataset.stepIndex);
                    const checked = event.target.checked;
                    const states = getProgress(checklistId, (items.find(item => String(item.id) === String(checklistId))?.items || []).length);
                    const hasPrevious = states.slice(0, stepIndex).every(Boolean);

                    if (checked && !hasPrevious) {
                        event.target.checked = false;
                        setStatus('Complete the previous steps first', 'error');
                        return;
                    }

                    const itemCount = (items.find(item => String(item.id) === String(checklistId))?.items || []).length;
                    if (!updateChecklistProgress(checklistId, stepIndex, checked, itemCount)) {
                        event.target.checked = false;
                        setStatus('Complete the previous steps first', 'error');
                        return;
                    }
                    renderChecklistList(items);
                });
            });

            resultsEl.querySelectorAll('.checklist-card').forEach(card => {
                card.addEventListener('click', (event) => {
                    if (event.target.closest('.step-item') || event.target.closest('.step-toggle')) {
                        return;
                    }
                    const id = card.dataset.checklistId;
                    selectedChecklistId = String(id) === String(selectedChecklistId) ? null : id;
                    renderChecklistList(items);
                });
            });
        }

        async function fetchJson(url, options = {}) {
            const response = await fetch(url, options);
            const text = await response.text();
            let json = null;
            try { json = text ? JSON.parse(text) : null; } catch (e) { }
            if (!response.ok) {
                throw new Error(json?.message || text || 'Request failed');
            }
            return json;
        }

        async function loadAll() {
            try {
                const data = await fetchJson(`${API_BASE}/api/checklists?${RESULTS_LIMIT_PARAM}`);
                renderChecklistList(data || []);
                setStatus('Loaded checklists');
            } catch (err) {
                setStatus(err.message, 'error');
            }
        }

        let searchDebounceTimer = null;

        async function performSearch(query) {
            const q = (query || '').trim();

            if (q === '/rand' || q === '/random') {
                try {
                    const checklist = await fetchJson(`${API_BASE}/api/checklists/random`);
                    selectedChecklistId = checklist?.id ?? null;
                    renderChecklistList(checklist ? [checklist] : []);
                    setStatus('Showing a random checklist');
                } catch (err) {
                    setStatus(err.message, 'error');
                }
                return;
            }

            try {
                const baseUrl = q ? `${API_BASE}/api/checklists/search?q=${encodeURIComponent(q)}` : `${API_BASE}/api/checklists`;
                const url = `${baseUrl}${baseUrl.includes('?') ? '&' : '?'}${RESULTS_LIMIT_PARAM}`;
                const data = await fetchJson(url);
                renderChecklistList(data || []);
                setStatus(q ? `Search results for: ${q}` : 'Showing all checklists');
            } catch (err) {
                setStatus(err.message, 'error');
            }
        }

        document.getElementById('searchInput').addEventListener('input', () => {
            const value = document.getElementById('searchInput').value;
            if (searchDebounceTimer) {
                clearTimeout(searchDebounceTimer);
            }
            searchDebounceTimer = setTimeout(() => {
                performSearch(value);
            }, 150);
        });

        document.getElementById('searchInput').addEventListener('keydown', (event) => {
            if (event.key !== 'Enter') {
                return;
            }
            const value = document.getElementById('searchInput').value;
            if (searchDebounceTimer) {
                clearTimeout(searchDebounceTimer);
            }
            performSearch(value);
        });

        document.getElementById('toggleCreatePanel').addEventListener('click', () => {
            const isCollapsed = createPanelEl.classList.toggle('collapsed');
            const expanded = !isCollapsed;
            toggleCreateBtn.textContent = expanded ? 'Collapse' : 'Expand';
            toggleCreatePanel.setAttribute('aria-expanded', String(expanded));
            if (expanded) {
                const activeMode = document.querySelector('.mode-btn.active')?.dataset.mode || 'text';
                setCreateMode(activeMode);
            }
        });

        document.querySelectorAll('.mode-btn').forEach(button => {
            button.addEventListener('click', () => setCreateMode(button.dataset.mode));
        });

        document.getElementById('checklistText').addEventListener('input', () => {
            syncFormFromText();
        });

        document.getElementById('title').addEventListener('input', () => {
            syncTextFromForm();
        });

        document.getElementById('description').addEventListener('input', () => {
            syncTextFromForm();
        });

        document.getElementById('items').addEventListener('input', () => {
            syncTextFromForm();
        });

        bindCreateFromButtons();

        document.getElementById('createTextBtn').addEventListener('click', async () => {
            const text = document.getElementById('checklistText').value.trim();

            if (!text) {
                setStatus('Checklist text is required', 'error');
                return;
            }

            try {
                const created = await fetchJson(`${API_BASE}/api/checklists/from-text`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: text
                });
                selectedChecklistId = created?.id ?? null;
                setStatus('Checklist created from text successfully');
                document.getElementById('checklistText').value = '';
                createPanelEl.classList.add('collapsed');
                toggleCreateBtn.textContent = 'Expand';
                toggleCreatePanel.setAttribute('aria-expanded', 'false');
                loadAll();
            } catch (err) {
                setStatus(err.message, 'error');
            }
        });

        document.getElementById('createFormBtn').addEventListener('click', async () => {
            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const items = document.getElementById('items').value
                .split(/\n/)
                .map(x => x.trim())
                .filter(Boolean);

            if (!title) {
                setStatus('Title is required', 'error');
                return;
            }

            try {
                const payload = { title, description, items };
                const created = await fetchJson(`${API_BASE}/api/checklists`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                selectedChecklistId = created?.id ?? null;
                setStatus('Checklist created from form successfully');
                document.getElementById('title').value = '';
                document.getElementById('description').value = '';
                document.getElementById('items').value = '';
                createPanelEl.classList.add('collapsed');
                toggleCreateBtn.textContent = 'Expand';
                toggleCreatePanel.setAttribute('aria-expanded', 'false');
                loadAll();
            } catch (err) {
                setStatus(err.message, 'error');
            }
        });

        document.addEventListener('keydown', async (event) => {
            const isPasteShortcut = (event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'v';
            if (!isPasteShortcut || createPanelEl.classList.contains('collapsed')) {
                return;
            }

            const textarea = document.getElementById('checklistText');
            if (!textarea) {
                return;
            }

            event.preventDefault();
            try {
                const clipboardText = await navigator.clipboard.readText();
                textarea.value = (textarea.value ? textarea.value + '\n' : '') + clipboardText.trim();
                textarea.focus();
                setStatus('Checklist text pasted into the creator');
            } catch (err) {
                setStatus('Paste failed. Please paste manually into the checklist text area.', 'error');
            }
        });

        loadAll();
    </script>
</body>

</html>
